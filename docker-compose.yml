version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: visionbridge-admin-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://76.13.109.151:18088}
    volumes:
      - ./public:/app/public:ro
    restart: unless-stopped
    networks:
      - visionbridge

networks:
  visionbridge:
    driver: bridge
